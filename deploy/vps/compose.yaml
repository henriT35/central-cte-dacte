name: central-cte-dacte

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: ${CENTRAL_CTE_IMAGE:-central-cte-dacte:r12.13.9}
    environment:
      CENTRAL_CTE_DATA_ROOT: /data
      CENTRAL_CTE_HOST: 0.0.0.0
      CENTRAL_CTE_PORT: "8765"
      CENTRAL_CTE_STRICT_PORT: "1"
      CENTRAL_CTE_ALLOW_REMOTE: "1"
      CENTRAL_CTE_HTTPS: ${CENTRAL_CTE_HTTPS:-1}
      CENTRAL_CTE_TRUST_PROXY: ${CENTRAL_CTE_TRUST_PROXY:-1}
      CENTRAL_CTE_ALLOWED_HOSTS: ${CENTRAL_CTE_ALLOWED_HOSTS:-app,localhost,127.0.0.1}
      CENTRAL_CTE_METRICS_TOKEN: ${CENTRAL_CTE_METRICS_TOKEN}
      CENTRAL_CTE_SSW_PG_DIRECT_ENABLED: ${CENTRAL_CTE_SSW_PG_DIRECT_ENABLED:-0}
      CENTRAL_CTE_SSW_PG_HOST: ${CENTRAL_CTE_SSW_PG_HOST:-}
      CENTRAL_CTE_SSW_PG_PORT: ${CENTRAL_CTE_SSW_PG_PORT:-5432}
      CENTRAL_CTE_SSW_PG_DBNAME: ${CENTRAL_CTE_SSW_PG_DBNAME:-}
      CENTRAL_CTE_SSW_PG_USER: ${CENTRAL_CTE_SSW_PG_USER:-}
      CENTRAL_CTE_SSW_PG_PASSWORD: ${CENTRAL_CTE_SSW_PG_PASSWORD:-}
      CENTRAL_CTE_SSW_PG_SSLMODE: ${CENTRAL_CTE_SSW_PG_SSLMODE:-prefer}
      CENTRAL_CTE_SSW_PG_SCHEMA: ${CENTRAL_CTE_SSW_PG_SCHEMA:-staging}
      CENTRAL_CTE_SSW_PG_TABLE: ${CENTRAL_CTE_SSW_PG_TABLE:-stg_ssw_455_fretes}
      CENTRAL_CTE_SSW_PG_CONNECT_TIMEOUT: ${CENTRAL_CTE_SSW_PG_CONNECT_TIMEOUT:-6}
    volumes:
      - central_cte_data:/data
      - central_cte_cache:/app/cache
    expose:
      - "8765"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${CENTRAL_CTE_MEMORY_LIMIT:-4g}
    cpus: ${CENTRAL_CTE_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/api/ready', headers={'Host':'127.0.0.1'}); raise SystemExit(0 if urllib.request.urlopen(r, timeout=10).status == 200 else 1)"]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  caddy:
    profiles: ["domain"]
    image: caddy:2.11.4-alpine
    environment:
      CENTRAL_CTE_DOMAIN: ${CENTRAL_CTE_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  backup:
    image: ${CENTRAL_CTE_IMAGE:-central-cte-dacte:r12.13.9}
    command: ["python", "-u", "/app/deploy/vps/scripts/backup_scheduler.py"]
    environment:
      BACKUP_SOURCE_ROOT: /data
      BACKUP_OUTPUT_ROOT: /backups
      BACKUP_INTERVAL_SECONDS: ${CENTRAL_CTE_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${CENTRAL_CTE_BACKUP_RETENTION_COUNT:-14}
      BACKUP_RUN_ON_START: ${CENTRAL_CTE_BACKUP_RUN_ON_START:-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-central-cte}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
    volumes:
      - central_cte_data:/data
      - ./backups:/backups
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  monitor:
    image: ${CENTRAL_CTE_IMAGE:-central-cte-dacte:r12.13.9}
    command: ["python", "-u", "/app/deploy/vps/scripts/monitor.py"]
    environment:
      MONITOR_URL: http://app:8765/api/ready
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-3}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MONITOR_STATE_PATH: /monitor/last_status.json
    volumes:
      - ./monitor:/monitor
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

volumes:
  central_cte_data:
  central_cte_cache:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
